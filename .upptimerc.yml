owner: nejimatv
repo: idllyc-status

sites:
  # the health route checks the database and the cache; it answers 200 with
  # another status when one is down, so the body decides
  - name: Jeu
    url: https://idllyc.mmorpg.ovh/health/
    __dangerous__body_down_if_text_missing: '"status": "healthy"'
  - name: Temps réel (chat, notifications)
    url: https://idllyc.mmorpg.ovh/socket.io/?EIO=4&transport=polling
  - name: Connexion
    url: https://idllyc.mmorpg.ovh/login/

status-website:
  baseUrl: /idllyc-status
  logoUrl: https://idllyc.mmorpg.ovh/static/favicon.png
  favicon: https://idllyc.mmorpg.ovh/static/favicon.png
  name: Idllyc MMO
  introTitle: "État des services d'Idllyc MMO"
  introMessage: "Vérifié toutes les 5 minutes depuis GitHub, hors de nos serveurs. Un incident ouvert ici est suivi jusqu'à sa résolution."
  navbar:
    - title: État
      href: /
    - title: Jouer
      href: https://idllyc.mmorpg.ovh/

