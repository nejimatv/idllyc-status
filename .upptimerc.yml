owner: nejimatv
repo: idllyc-status

sites:
  # the health route checks the database and the cache; it answers 200 with
  # another status when one is down, so the body decides
  - name: Jeu
    url: https://idllyc.mmorpg.ovh/health/
    __dangerous__body_down_if_text_missing: '"status": "healthy"'
  - name: Temps réel (chat, notifications)
    url: https://idllyc.mmorpg.ovh/socket.io/?EIO=4&transport=polling
  - name: Connexion
    url: https://idllyc.mmorpg.ovh/login/

status-website:
  baseUrl: /idllyc-status
  logoUrl: https://idllyc.mmorpg.ovh/static/favicon.png
  favicon: https://idllyc.mmorpg.ovh/static/favicon.png
  name: Idllyc MMO
  introTitle: "État des services"
  introMessage: "Vérifié toutes les 5 minutes depuis GitHub, hors de nos serveurs. Un incident ouvert ici est suivi jusqu'à sa résolution."
  theme: dark
  # the game's palette (game/static/css/game.css): dark panels, one green, sober cards
  customHeadHtml: |
    <style>
          html:root {
            --body-background-color: #0d1117; --body-text-color: #e6edf3;
            --card-background-color: #161b22; --card-border-color: #30363d;
            --nav-background-color: #161b22; --nav-border-bottom-color: #30363d;
            --nav-current-border-bottom-color: #22c55e;
            --up-border-left-color: #22c55e; --down-border-left-color: #f85149;
            --degraded-border-left-color: #f59e0b; --down-background-color: rgba(248, 81, 73, 0.12);
            --tag-color: #0d1117; --tag-up-background-color: #22c55e;
            --tag-down-background-color: #f85149; --tag-degraded-background-color: #f59e0b;
            --change-background-color: #f0b429;
            --error-button-border-color: rgba(34, 197, 94, 0.3); --error-button-background-color: rgba(34, 197, 94, 0.15);
            --error-button-color: #4ade80;
            --submit-button-border-color: rgba(34, 197, 94, 0.3); --submit-button-background-color: rgba(34, 197, 94, 0.15);
            --submit-button-color: #4ade80;
              }
          body { font-family: 'Segoe UI', Arial, sans-serif; }
          h1 { color: #22c55e; font-weight: 600; font-size: 1.75em; }
          h2 { font-size: 1.15em; font-weight: 600; }
          article { border-radius: 8px; }
          main p, main h3 { color: #a2a9b1; }
          footer, footer a { color: #8b949e; }
      /* the response time graph is the card's background image: drawn again in a layer that
         can take a filter, the game's green, faint behind the text */
      html body main article.graph { background-image: none !important; }
      html body main article.graph::before { content: ''; position: absolute; inset: 0; z-index: 0;
        background: var(--background) center right / contain no-repeat; border-radius: inherit;
        filter: hue-rotate(-26deg) saturate(0.8); opacity: 0.3; pointer-events: none; }
      html body main article.graph > * { position: relative; z-index: 1; }
        </style>
  navbar:
    - title: État
      href: /
    - title: Jouer
      href: https://idllyc.mmorpg.ovh/

